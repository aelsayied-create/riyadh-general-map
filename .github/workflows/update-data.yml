name: Update map data (OpenStreetMap + RCRC)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_osm:
        description: "Download OpenStreetMap data again"
        type: boolean
        default: true
  schedule:
    - cron: "17 2 1 * *"   # monthly refresh, 1st of the month

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to download OSM data
        id: need
        run: |
          if [ ! -f web/data/osm/manifest.json ] || [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.refresh_osm }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v5
        if: steps.need.outputs.run == 'true'
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        if: steps.need.outputs.run == 'true'
        with: { node-version: "20" }

      - name: Install tools
        if: steps.need.outputs.run == 'true'
        run: |
          pip install geopandas pyogrio shapely
          npm install -g osmtogeojson
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Royal Commission transport data (quick)
        if: steps.need.outputs.run == 'true'
        run: |
          python scripts/rcrc_transport.py --download || echo "RCRC refresh skipped"
          git add web/data data_src
          git diff --cached --quiet || git commit -m "RCRC data and municipalities $(date +%F)"
          git pull --rebase -X theirs origin main && git push

      - name: OpenStreetMap layers (slow)
        if: steps.need.outputs.run == 'true'
        timeout-minutes: 150
        run: |
          python -u scripts/fetch_osm.py
          git add web/data/osm
          git diff --cached --quiet || git commit -m "OpenStreetMap data $(date +%F)"
          git pull --rebase -X theirs origin main && git push
